        type: file
        path: src/logs/index.njk
        format: code
      - name: dining-index
        label: Dining index
        type: file
        path: src/logs/dining/index.njk
        format: code
      - name: events-index
        label: Events index
        type: file
        path: src/logs/events/index.njk
        format: code
      - name: travel-index
        label: Travel index
        type: file
        path: src/logs/travel/index.njk
        format: code
      - name: work-index
        label: Work index
        type: file
        path: src/logs/work/index.njk
        format: code
      - name: bears-devlog-index
        label: Bears devlog index
        type: file
        path: src/projects/bears/devlog/index.njk
        format: code
      - name: hexmap-devlog-index
        label: Hexmap devlog index
        type: file
        path: src/projects/hexmap/devlog/index.njk
        format: code
      - name: eurovision-index
        label: Eurovision
        type: file
        path: src/projects/eurovision-2013/index.html
        format: code
      - name: eurovision-matrix
        label: Eurovision matrix
